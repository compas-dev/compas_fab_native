[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "compas_fab_native"
description = "Native (Rust) planning backend for compas_fab: batched kinematics, collision checks, Cartesian and free-motion planning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{ name = "Gramazio Kohler Research", email = "gramaziokohler@arch.ethz.ch" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
# trimesh, rtree, scipy and networkx fit collision spheres to link meshes (Python side for now).
dependencies = ["compas_fab>=2.1,<3", "numpy", "trimesh>=4", "rtree", "scipy", "networkx"]

[tool.maturin]
manifest-path = "crates/motion_py/Cargo.toml"
module-name = "compas_fab_native._core"
python-source = "src"
features = ["pyo3/extension-module"]
