<rect x="400" y="680" width="200" height="40" rx="20.0" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="500.0" y="704.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Solutions</text>
<line x1="24" y1="752" x2="976" y2="752" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="24" y="772" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="104" y="764" width="20" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="132" y="773" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">start / end</text>
<rect x="215" y="764" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="243" y="773" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">step</text>
<polygon points="298,762 308,770 298,778 288,770" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="316" y="773" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">decision</text>
<rect x="383" y="764" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="411" y="773" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">what the solve minimises</text>
</svg>
