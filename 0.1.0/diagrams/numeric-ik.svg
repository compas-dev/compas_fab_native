<text x="644.0" y="385" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO · λ×10</text>
<path d="M 500,432 V 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="508" y="450" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="540.0" y="459" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES · λ÷3</text>
<path d="M 404,516 H 308 Q 300,516 300,508 V 220 Q 300,212 308,212 H 380" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
