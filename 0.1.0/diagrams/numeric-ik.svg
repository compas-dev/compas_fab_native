<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="796" viewBox="0 0 1000 796" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="numeric-ik-title numeric-ik-desc">
<title id="numeric-ik-title">How numerical IK solves from one seed</title>
<desc id="numeric-ik-desc">Numerical IK from one seed: an optional carry stage for prismatic axes, then Levenberg-Marquardt steps on pose, rest-posture and collision residuals until the pose converges without contact, then acceptance by the sphere checker.</desc>
