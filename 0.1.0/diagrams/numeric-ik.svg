<rect x="508" y="566" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="524.0" y="575" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<path d="M 500,648 V 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="400" y="24" width="200" height="40" rx="20.0" fill="#f5f5f5"/>
