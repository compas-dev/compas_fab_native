<polygon points="500,480 596,516 500,552 404,516" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="513" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Converged,</text>
<text x="500" y="527" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">no contact?</text>
<rect x="380" y="592" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="380" y="592" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
