<text x="500.0" y="306.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Levenberg–Marquardt step</text>
<text x="500.0" y="322.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">clamped to joint limits</text>
