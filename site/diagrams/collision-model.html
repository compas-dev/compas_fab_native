<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four collision checks, fast to exact</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1100px; width: 100%; }
.eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Layer stack · compas_fab native backend</p>
<h1>Four collision checks, fast to exact</h1>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collision-model-title collision-model-desc">
<title id="collision-model-title">Four collision checks, fast to exact</title>
<desc id="collision-model-desc">The four collision checks of the native backend, from bounding spheres through link spheres and optional convex hulls to exact meshes, and where each is used.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 64,48 V 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="56" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.1em">FAST</text>
<text x="56" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.1em">EXACT</text>
<rect x="96" y="40" width="864" height="72" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="120" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">01</text>
<text x="168" y="74" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Broad phase</text>
<text x="168" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a bounding sphere per link</text>
<text x="936" y="80" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">every check · skips most work</text>
<rect x="96" y="120" width="864" height="72" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="120" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">02</text>
<text x="168" y="154" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Spheres</text>
<text x="168" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">link spheres vs boxes, ESDF, other links</text>
<text x="936" y="160" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">RRT · IK residuals · clearances</text>
<rect x="96" y="200" width="864" height="72" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="120" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">03</text>
<text x="168" y="234" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Convex hulls</text>
<text x="168" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">5 mm margin · opt-in (exact_links)</text>
<text x="936" y="240" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">poorly fitted links, in the loop</text>
<rect x="96" y="280" width="864" height="72" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="120" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">04</text>
<text x="168" y="314" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Exact meshes</text>
<text x="168" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">parry3d, the final word</text>
<text x="936" y="320" fill="#7a8399" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">goals · every planned path</text>
<line x1="24" y1="376" x2="976" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="24" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="104" y="388" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="132" y="397" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">decides what is handed out</text>
</svg>
</div>

</html>
