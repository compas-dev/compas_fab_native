name: ci

# Rust core and Python backend: lint, tests, Python extension, and CPU benchmarks
# on every commit. Benchmark results are in the job summary and uploaded as an artifact
# (bench-<sha>); on pull requests they are compared against the base commit on the same runner.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Rust tests
        # motion_py links against Python as an extension module; it is tested through pytest.
        run: cargo test --workspace --exclude motion_py --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the extension
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.9,<2"
          maturin build --release --out dist
          python -m pip install dist/*.whl pytest
      - name: Python tests
        run: python -m pytest tests -v

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark this commit
        run: cargo run --release -p motion_bench --bin ci_bench -- bench.json
      - name: Benchmark the base commit
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -f ../base/crates/motion_bench/src/bin/ci_bench.rs ]; then
            (cd ../base && cargo run --release -p motion_bench --bin ci_bench -- "$GITHUB_WORKSPACE/bench_base.json")
          else
            echo "The base commit has no ci_bench; nothing to compare against."
          fi
      - name: Summary
        run: |
          {
            echo "## Native core benchmarks"
            echo
            if [ -f bench_base.json ]; then
              python3 scripts/compare_bench.py bench.json bench_base.json
            else
              python3 scripts/compare_bench.py bench.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: bench-${{ github.sha }}
          path: bench*.json
