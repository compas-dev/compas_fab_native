name: wheels

# Builds the compas_fab_native extension as release wheels (abi3: one wheel per platform
# for every Python >= 3.9) and tests each wheel on the oldest and newest Python we support.
# Python 3.9 is what Rhino 8 ships. Nothing is published: the wheels are uploaded as
# artifacts (native-wheel-<platform>).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
          - platform: macos-universal2
            os: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
          - platform: windows-x64
            os: windows-2022
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@v6
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: native-wheel-${{ matrix.platform }}
          path: dist/*.whl

  test:
    name: test (${{ matrix.platform }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, macos-universal2, windows-x64]
        python: ["3.9", "3.13"]
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: macos-universal2
            os: macos-latest
          - platform: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: native-wheel-${{ matrix.platform }}
          path: dist
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -c "import compas_fab_native, sys; print(sys.version, compas_fab_native.__file__)"
      - name: Native tests on the installed wheel
        run: python -m pytest tests -q
